### ASOO Portal — Data Connect schema
### SOURCE OF TRUTH for the PostgreSQL database.
###
### Rules (see CLAUDE.md §5 and docs/03-data-model.md):
###   - Money is BIGINT fils. 1 JOD = 1000 fils. Never a float.
###   - Timestamps are stored UTC, displayed Asia/Amman.
###   - User-facing text lives in `*Translation` tables keyed by locale.
###   - Financial rows are append-only. Corrections are new rows.
###   - Never hand-edit generated SDK output. Change this file instead.

# =============================================================================
# ENUMS
# =============================================================================

enum Locale { ar en }

enum MemberStatus { pending active suspended expired withdrawn deceased }

enum ApplicationStatus { submitted under_review info_requested approved rejected }

enum RenewalStatus { draft submitted under_review approved rejected }

enum BillingCycle { annual one_time }

enum InvoiceType { subscription renewal certificate penalty service credit_note adjustment }

enum InvoiceStatus { draft issued partially_paid paid overdue cancelled waived }

enum PaymentAttemptStatus { pending redirected awaiting_payment succeeded failed expired cancelled }

enum PaymentChannel { efawateercom card cash bank_transfer }

enum RefundStatus { requested approved processed rejected failed }

enum PublishStatus { draft scheduled published archived }

"""
Where a block sits. The syndicate's existing homepage runs the hero and the
news feed side by side, which a flat vertical stack cannot express.
`aside` blocks collapse below `main` on mobile.
"""
enum LayoutRegion { main aside }

enum LayoutBlockType {
  hero
  stat_counters
  service_grid
  link_cards
  news_feed
  document_list
  directory_search
  rich_text
  cta_banner
}

enum CertificateStatus { valid expired revoked }

enum CertificateRequestStatus { submitted under_review approved issued rejected }

enum ComplaintType { boundary_dispute technical professional_conduct administrative other }

enum ComplaintStatus { submitted triaged in_progress resolved closed }

enum Priority { low normal high urgent }

enum NotificationChannel { email sms in_app }

enum NotificationStatus { queued sent delivered failed bounced }

enum CampaignStatus { draft scheduled sending sent cancelled }

enum DocumentType { license national_id qualification other }


# =============================================================================
# IDENTITY & ACCESS
# =============================================================================

"""A person with a login. `id` is the Firebase Auth UID — one identity per person."""
type User @table(name: "users", key: ["id"]) {
  id: String!
  email: String @col(dataType: "citext") @unique
  phone: String
  displayName: String
  preferredLocale: Locale! @default(value: ar)
  isActive: Boolean! @default(value: true)
  lastLoginAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Role @table(name: "roles") {
  id: UUID! @default(expr: "uuidV4()")
  code: String! @unique          # super_admin, finance_officer, ...
  nameAr: String!
  nameEn: String!
  description: String
  isSystem: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
}

"""Permissions are `resource:action` strings, e.g. `invoices:issue`."""
type Permission @table(name: "permissions") {
  id: UUID! @default(expr: "uuidV4()")
  code: String! @unique
  resource: String!
  action: String!
  description: String
}

type RolePermission @table(name: "role_permissions", key: ["role", "permission"]) {
  role: Role!
  permission: Permission!
}

type UserRole @table(name: "user_roles", key: ["user", "role"]) {
  user: User!
  role: Role!
  grantedBy: User
  grantedAt: Timestamp! @default(expr: "request.time")
}

"""
Append-only. NEVER updated, NEVER deleted.
Written in the same transaction as the mutation it records.
"""
type AuditLog @table(name: "audit_logs") {
  id: UUID! @default(expr: "uuidV4()")
  actorUser: User                 # null for system jobs
  actorRole: String               # snapshot — roles change, the log must not
  action: String!                 # invoice.waive, member.suspend, post.publish
  entityType: String!
  entityId: String!
  before: Any
  after: Any
  reason: String                  # required for waivers, suspensions, rejections
  ipAddress: String
  userAgent: String
  createdAt: Timestamp! @default(expr: "request.time")
}


# =============================================================================
# REFERENCE DATA
# =============================================================================

"""The 12 Jordanian governorates. Seeded, not user-editable."""
type Governorate @table(name: "governorates") {
  id: UUID! @default(expr: "uuidV4()")
  code: String! @unique
  nameAr: String!
  nameEn: String!
  position: Int! @default(value: 0)
}

type MemberCategory @table(name: "member_categories") {
  id: UUID! @default(expr: "uuidV4()")
  code: String! @unique
  nameAr: String!
  nameEn: String!
  isActive: Boolean! @default(value: true)
}


# =============================================================================
# MEMBERSHIP
# =============================================================================

type Member @table(name: "members") {
  id: UUID! @default(expr: "uuidV4()")
  user: User @unique               # null until the member claims their account
  licenseNumber: String! @unique   # DLS-issued; the public identifier
  membershipNumber: String! @unique
  category: MemberCategory!
  governorate: Governorate!
  status: MemberStatus! @default(value: pending)
  joinedAt: Date
  licenseExpiresAt: Date

  # PII — encrypted at rest, never returned outside the member's own record
  # or a membership officer's view.
  nationalId: String

  phone: String
  email: String @col(dataType: "citext")

  # Directory consent and the separately-publishable contact set.
  isDirectoryVisible: Boolean! @default(value: false)
  directoryPhone: String
  directoryEmail: String
  directoryAddress: String

  # Normalized for Arabic search: tashkeel stripped, alef/ta-marbuta/ya unified.
  # Without this, "احمد" does not match "أحمد" — the most common Arabic
  # search failure. Populated on write, indexed with pg_trgm.
  searchNormalized: String

  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type MemberTranslation @table(name: "member_translations", key: ["member", "locale"]) {
  member: Member!
  locale: Locale!
  fullName: String!
  officeName: String
  bio: String
  specializations: [String]
}

"""Stored in the PRIVATE bucket. Never served by public URL."""
type MemberDocument @table(name: "member_documents") {
  id: UUID! @default(expr: "uuidV4()")
  member: Member!
  documentType: DocumentType!
  storagePath: String!
  fileName: String!
  fileSize: Int
  mimeType: String
  verifiedBy: User
  verifiedAt: Timestamp
  expiresAt: Date
  uploadedAt: Timestamp! @default(expr: "request.time")
}

"""The public join form. Kept permanently — a rejection is part of the record."""
type MembershipApplication @table(name: "membership_applications") {
  id: UUID! @default(expr: "uuidV4()")
  applicantName: String!
  applicantEmail: String! @col(dataType: "citext")
  applicantPhone: String!
  nationalId: String
  licenseNumber: String
  category: MemberCategory
  governorate: Governorate
  officeName: String
  notes: String
  status: ApplicationStatus! @default(value: submitted)
  reviewedBy: User
  reviewedAt: Timestamp
  reviewNotes: String
  createdMember: Member            # set on approval
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

"""One per member per membership year. Unique on (member, membershipYear)."""
type Renewal @table(name: "renewals", key: ["member", "membershipYear"]) {
  member: Member!
  membershipYear: Int!
  status: RenewalStatus! @default(value: draft)
  submittedAt: Timestamp
  reviewedBy: User
  reviewedAt: Timestamp
  reviewNotes: String
  invoice: Invoice
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}


# =============================================================================
# FINANCE  —  append-only. Corrections are new rows, never updates.
# =============================================================================

"""
Versioned by date, never edited in place. Changing the 2026 fee creates a new
row; 2025 invoices keep pointing at the 2025 row and still reconcile.
"""
type FeePlan @table(name: "fee_plans") {
  id: UUID! @default(expr: "uuidV4()")
  code: String!
  category: MemberCategory         # null = applies to all categories
  amountFils: Int64!               # 1 JOD = 1000 fils
  currency: String! @default(value: "JOD")
  billingCycle: BillingCycle!
  effectiveFrom: Date!
  effectiveTo: Date
  isActive: Boolean! @default(value: true)
  createdBy: User
  createdAt: Timestamp! @default(expr: "request.time")
}

type FeePlanTranslation @table(name: "fee_plan_translations", key: ["feePlan", "locale"]) {
  feePlan: FeePlan!
  locale: Locale!
  name: String!
  description: String
}

type Invoice @table(name: "invoices") {
  id: UUID! @default(expr: "uuidV4()")

  # Human-facing, sequential per year: ASOO-2026-000123.
  # Generated from a Postgres sequence — never from a COUNT, which races.
  invoiceNumber: String! @unique

  member: Member                   # null for a public/contractor invoice
  payerName: String
  payerContact: String

  type: InvoiceType!
  parentInvoice: Invoice           # set on credit notes and adjustments
  status: InvoiceStatus! @default(value: draft)

  subtotalFils: Int64! @default(value: 0)
  discountFils: Int64! @default(value: 0)
  totalFils: Int64! @default(value: 0)
  paidFils: Int64! @default(value: 0)
  currency: String! @default(value: "JOD")

  issuedAt: Timestamp
  dueAt: Timestamp
  settledAt: Timestamp

  # Short opaque code entered on /services/pay to find a bill without
  # logging in. RANDOM, not sequential — a sequential reference would let
  # anyone enumerate every invoice in the system.
  publicReference: String @unique

  notes: String
  createdBy: User
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type InvoiceLine @table(name: "invoice_lines") {
  id: UUID! @default(expr: "uuidV4()")
  invoice: Invoice!
  feePlan: FeePlan                 # null for ad-hoc lines
  # Snapshot text — a later fee-plan rename must not rewrite invoice history.
  description: String!
  quantity: Int! @default(value: 1)
  unitAmountFils: Int64!
  lineTotalFils: Int64!
  position: Int! @default(value: 0)
}

"""One row each time a payer starts a payment. Multiple attempts are normal."""
type PaymentAttempt @table(name: "payment_attempts") {
  id: UUID! @default(expr: "uuidV4()")
  invoice: Invoice!
  provider: String!                # mock | efawateercom | hyperpay | ...
  providerRef: String
  billNumber: String               # eFAWATEERcom bill number
  amountFils: Int64!
  status: PaymentAttemptStatus! @default(value: pending)
  redirectUrl: String
  failureReason: String
  expiresAt: Timestamp
  initiatedBy: User                # null for anonymous public payment
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

"""
A SETTLED payment. Created by the webhook handler only — never by a client.
`providerTransactionId` is unique; that constraint is what makes webhook
replay safe.
"""
type Payment @table(name: "payments") {
  id: UUID! @default(expr: "uuidV4()")
  invoice: Invoice!
  attempt: PaymentAttempt
  provider: String!
  providerTransactionId: String! @unique   # IDEMPOTENCY KEY
  amountFils: Int64!
  currency: String! @default(value: "JOD")
  channel: PaymentChannel!
  paidAt: Timestamp!
  reconciledAt: Timestamp
  # Cash and bank transfers are recorded by a finance officer in person.
  recordedBy: User
  createdAt: Timestamp! @default(expr: "request.time")
}

"""
IMMUTABLE raw provider log. Written BEFORE any business logic runs, so a bug
in processing never loses the provider's message.
"""
type PaymentWebhook @table(name: "payment_webhooks") {
  id: UUID! @default(expr: "uuidV4()")
  provider: String!
  eventId: String! @unique
  eventType: String
  signatureValid: Boolean!
  rawPayload: Any!
  attempt: PaymentAttempt
  receivedAt: Timestamp! @default(expr: "request.time")
  processedAt: Timestamp
  processingError: String
}

type Receipt @table(name: "receipts") {
  id: UUID! @default(expr: "uuidV4()")
  payment: Payment! @unique
  receiptNumber: String! @unique
  storagePath: String
  issuedAt: Timestamp! @default(expr: "request.time")
}

"""Never modifies the original payment row."""
type Refund @table(name: "refunds") {
  id: UUID! @default(expr: "uuidV4()")
  payment: Payment!
  amountFils: Int64!
  reason: String!                  # required
  status: RefundStatus! @default(value: requested)
  providerRef: String
  requestedBy: User
  approvedBy: User
  processedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}


