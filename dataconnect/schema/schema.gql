  readAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}


# =============================================================================
# ORDERS, REPORT REVIEW & APPROVAL   (added Phase 2)
#
# A surveyor uploads a technical report (PDF / Word / DWG) against an ORDER.
# Syndicate staff review it and either approve, reject, or request a revision.
# On approval an APPROVAL artifact is issued carrying a random verification
# code; a QR encoding that code lets anyone confirm the approval on a public
# page — the workflow the syndicate asked for.
#
# Design rules that carry over from the rest of the schema:
#   - Report files live in the PRIVATE bucket; only signed URLs, never public.
#   - Reviews and approvals are APPEND-ONLY history. A re-review is a new row.
#   - A resubmission is a NEW submission row with an incremented version, so the
#     full trail of what was uploaded and when survives audit.
#   - The public verify endpoint exposes the MINIMUM: valid/revoked, order
#     number, title, member name, approval date. Never the file, never PII.
# =============================================================================

enum OrderType {
  land_subdivision      # إفراز
  land_settlement       # تسوية
  topographic_survey    # رفع مساحي
  boundary_survey       # تحديد حدود
  site_plan             # مخطط موقع
  other
}

enum OrderStatus {
  draft
  submitted             # member has attached at least one report
  in_review             # staff is reviewing
  revision_requested    # sent back to the member
  approved
  rejected
  cancelled
  completed             # approval issued and closed
}

"""The file kinds a surveyor may upload. DWG is the AutoCAD binary drawing."""
enum ReportFileType { pdf docx dwg }

enum SubmissionStatus {
  uploaded
  under_review
  revision_requested
  approved
  rejected
  superseded            # replaced by a newer version
}

enum ReviewDecision { approved rejected revision_requested }

enum ApprovalStatus { valid revoked }

"""
A unit of survey work a report is filed against. `orderNumber` is the human
identifier a member types on the upload form to connect their file; the random
nothing-derived id stays internal.
"""
type Order @table(name: "orders") {
  id: UUID! @default(expr: "uuidV4()")
  orderNumber: String! @unique          # ORD-2026-000123, from a sequence
  member: Member!                        # the surveyor responsible
  governorate: Governorate
  type: OrderType!
  status: OrderStatus! @default(value: draft)
  title: String!
  parcelReference: String                # basin / block / parcel, survey context
  clientName: String                     # who the work is for (optional)
  notes: String
  submittedAt: Timestamp                 # first report attached
  decidedAt: Timestamp                   # approved or rejected
  createdBy: User
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

"""
One uploaded report file, linked to an order. A resubmission is a NEW row with
`version` + 1 and the prior row marked `superseded`, so the history is intact.
Files are in the PRIVATE bucket — served only via short-lived signed URLs after
a permission check.
"""
type ReportSubmission @table(name: "report_submissions") {
  id: UUID! @default(expr: "uuidV4()")
  order: Order!
  submittedBy: User!
  fileType: ReportFileType!
  storagePath: String!
  fileName: String!
  fileSize: Int
  mimeType: String
  # SHA-256 of the bytes. Integrity matters for DWG/reports that carry legal
  # weight — a stored checksum proves the reviewed file is the issued file.
  checksum: String
  version: Int! @default(value: 1)
  status: SubmissionStatus! @default(value: uploaded)
  # Uploaded-but-unscanned files are never served. See docs/08-security §6.
  virusScanned: Boolean! @default(value: false)
  note: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

"""
An immutable review decision on a submission. Append-only: a second look is a
second row. Written in the same transaction as the submission status change,
via the shared audit wrapper.
"""
type ReportReview @table(name: "report_reviews") {
  id: UUID! @default(expr: "uuidV4()")
  submission: ReportSubmission!
  reviewer: User!
  reviewerRole: String                   # snapshot at decision time
  decision: ReviewDecision!
  comments: String                       # required for reject / revision
  createdAt: Timestamp! @default(expr: "request.time")
}

"""
The approval artifact issued when a report passes review. `verificationCode` is
what the QR encodes; the public verify page reads THIS by code and returns only
non-sensitive fields. One approval per approved submission.
"""
type ReportApproval @table(name: "report_approvals") {
  id: UUID! @default(expr: "uuidV4()")
  submission: ReportSubmission! @unique
  order: Order!                          # denormalised for the public lookup
  approvalNumber: String! @unique        # APR-2026-000123, from a sequence
  # Random, URL-safe, NOT derived from any sequential id — a sequential code
  # would let anyone enumerate every approval. docs/08-security §8.
  verificationCode: String! @unique
  storagePath: String                    # approval PDF carrying the QR
  status: ApprovalStatus! @default(value: valid)
  approvedBy: User!
  issuedAt: Timestamp! @default(expr: "request.time")
  expiresAt: Timestamp
  revokedAt: Timestamp
  revokedReason: String
}
