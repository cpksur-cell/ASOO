  complainantMember: Member        # null when a member of the public complains
  complainantName: String
  complainantEmail: String
  complainantPhone: String
  subjectMember: Member            # who the complaint is about
  type: ComplaintType!
  status: ComplaintStatus! @default(value: submitted)
  priority: Priority! @default(value: normal)
  subject: String!
  body: String!
  assignedTo: User
  resolutionSummary: String
  resolvedAt: Timestamp
  closedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ComplaintMessage @table(name: "complaint_messages") {
  id: UUID! @default(expr: "uuidV4()")
